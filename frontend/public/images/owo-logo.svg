<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- OwO Face Icon -->
  <g transform="translate(5, 5)">
    <!-- Face circle -->
    <circle cx="20" cy="20" r="18" fill="url(#gradient1)" />
    
    <!-- Left eye (O) -->
    <circle cx="13" cy="18" r="5" fill="white" />
    <circle cx="13" cy="18" r="2.5" fill="#1f2937" />
    
    <!-- Right eye (O) -->
    <circle cx="27" cy="18" r="5" fill="white" />
    <circle cx="27" cy="18" r="2.5" fill="#1f2937" />
    
    <!-- Mouth (w) -->
    <path d="M14 26 Q16 30 20 26 Q24 30 26 26" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- OwO Text -->
  <text x="55" y="35" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#1f2937">
    OwO
  </text>
</svg>
